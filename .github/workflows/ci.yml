
name: Recipe Planner Backend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v6

      - name: Java 17 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build und Tests ausführen
        working-directory: recipe-planner-backend
        run: mvn --batch-mode verify

      - name: JaCoCo Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: recipe-planner-backend/target/site/jacoco/